[develop]
script_dir=$base/lib/phd
[install]
install_scripts=$base/lib/phd

[flake8]
exclude =
    backup
    phd/backup
    build
    install
    log
    venv
    WeavingMapGenerator-master
    phd/WeavingMapGenerator-master

[pydocstyle]
match-dir = (?!backup|build|install|log|venv|WeavingMapGenerator-master).*
