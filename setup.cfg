[develop]
script_dir=$base/lib/phd
[install]
install_scripts=$base/lib/phd

[flake8]
exclude =
    archive
    backup
    phd/backup
    build
    install
    log
    venv
    WeavingMapGenerator-master
    phd/WeavingMapGenerator-master

[pydocstyle]
match-dir = (?!archive|backup|build|install|log|venv|WeavingMapGenerator-master).*

[tool:pytest]
norecursedirs = .* archive build dist install log venv *.egg node_modules
